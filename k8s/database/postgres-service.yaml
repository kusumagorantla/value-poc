# k8s/database/postgres-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: jarvis-postgres-svc
  namespace: jarvis
  labels:
    app: jarvis-postgres
    component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: jarvis-postgres