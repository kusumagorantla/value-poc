# k8s/ui/ui-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-ui
  namespace: jarvis
  labels:
    app: jarvis-ui
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: jarvis-ui
  template:
    metadata:
      labels:
        app: jarvis-ui
        component: frontend
    spec:
      containers:
        - name: jarvis-ui
          # Use JFrog image
          image: valeodemo.jfrog.io/docker-local/jarvis-ui:main-0e0f6f1-20260820093205
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: REACT_APP_API_URL
              value: "http://jarvis-api-svc:8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      # imagePullSecrets:
      #   - name: jfrog-secret