# k8s/ui/ui-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: jarvis-ui-svc
  namespace: jarvis
  labels:
    app: jarvis-ui
    component: frontend
  annotations:
    # GKE specific annotations (optional)
    cloud.google.com/load-balancer-type: "External"
    # Optional: Set static IP (uncomment if you have reserved IP)
    cloud.google.com/load-balancer-ipv4: "34.163.140.113"
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: jarvis-ui