# k8s/ui/ui-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: jarvis-ui-svc
  namespace: jarvis
  labels:
    app: jarvis-ui
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: jarvis-ui
---
# Optional: NodePort for external access
apiVersion: v1
kind: Service
metadata:
  name: jarvis-ui-nodeport
  namespace: jarvis
  labels:
    app: jarvis-ui
    component: frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
  selector:
    app: jarvis-ui