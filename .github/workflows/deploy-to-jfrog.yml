name: Build and Push to JFrog Artifactory

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  JFROG_URL: http://34.163.157.242:8082
  DOCKER_REPO: docker-local
  ARTIFACT_REPO: generic-local
  API_IMAGE_NAME: jarvis-api
  UI_IMAGE_NAME: jarvis-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version tags
        id: version
        run: |
          BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          VERSION="${BRANCH_NAME}-${SHORT_SHA}-${TIMESTAMP}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Configure JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          jfrog-url: ${{ env.JFROG_URL }}
          user: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_PASSWORD }}

      - name: Configure Docker to use JFrog
        run: |
          # Configure JFrog as Docker registry
          jfrog rt docker-push --help || true
          
          # Set up docker config for JFrog
          mkdir -p ~/.docker
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login 34.163.157.242:8082 -u "${{ secrets.JFROG_USER }}" --password-stdin 2>/dev/null || \
          echo "Direct docker login failed, will use JFrog CLI"

      # ============================================
      # BUILD JARVIS API IMAGE
      # ============================================
      - name: Build jarvis-api image
        run: |
          docker build \
            -f ./src/Jarvis.Traceability.Api/Dockerfile \
            -t 34.163.157.242:8082/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -t 34.163.157.242:8082/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:latest \
            ./src/Jarvis.Traceability.Api

      - name: Push jarvis-api to JFrog
        run: |
          jfrog rt docker-push \
            34.163.157.242:8082/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            ${{ env.DOCKER_REPO }} \
            --build-name=jarvis-api --build-number=${{ steps.version.outputs.version }}
          
          jfrog rt docker-push \
            34.163.157.242:8082/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:latest \
            ${{ env.DOCKER_REPO }}

      # ============================================
      # BUILD JARVIS UI IMAGE  
      # ============================================
      - name: Build jarvis-ui image
        run: |
          docker build \
            -f ./frontend/Dockerfile \
            -t 34.163.157.242:8082/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -t 34.163.157.242:8082/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:latest \
            ./frontend

      - name: Push jarvis-ui to JFrog
        run: |
          jfrog rt docker-push \
            34.163.157.242:8082/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            ${{ env.DOCKER_REPO }} \
            --build-name=jarvis-ui --build-number=${{ steps.version.outputs.version }}
          
          jfrog rt docker-push \
            34.163.157.242:8082/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:latest \
            ${{ env.DOCKER_REPO }}

      # ============================================
      # UPLOAD ARTIFACTS
      # ============================================
      - name: Create artifacts
        run: |
          mkdir -p artifacts
          cp docker-compose.yml artifacts/
          
          cat > artifacts/build-info.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "branch": "${{ steps.version.outputs.branch }}",
            "commit": "${{ github.sha }}",
            "images": {
              "jarvis-api": "34.163.157.242:8082/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:${{ steps.version.outputs.version }}",
              "jarvis-ui": "34.163.157.242:8082/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:${{ steps.version.outputs.version }}"
            }
          }
          EOF

      - name: Upload artifacts to JFrog
        run: |
          jfrog rt upload "artifacts/*" "${{ env.ARTIFACT_REPO }}/jarvis/${{ steps.version.outputs.version }}/" \
            --build-name=jarvis-build --build-number=${{ steps.version.outputs.version }}

      - name: Publish build info
        run: |
          jfrog rt build-publish

      - name: Summary
        run: |
          echo "✅ Images pushed:"
          echo "   - 34.163.157.242:8082/${{ env.DOCKER_REPO }}/${{ env.API_IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          echo "   - 34.163.157.242:8082/${{ env.DOCKER_REPO }}/${{ env.UI_IMAGE_NAME }}:${{ steps.version.outputs.version }}"