<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Admin Console — UI mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --surface-2:#FAFBFB;
  --ink:#141C24; --ink-2:#5B6875; --ink-3:#8A96A2;
  --rule:#DBE1E6; --rule-2:#EDF1F3;
  --accent:#2D3E7B; --accent-2:#3E51A0; --accent-tint:#EEF0F8;
  --ok:#17796A; --ok-tint:#E4F2EF;
  --warn:#B4791A; --warn-tint:#FAF0DC;
  --bad:#B03A2E; --bad-tint:#FBEAE7;
  --degraded:#6B5CA5; --degraded-tint:#EFEDF7;
  --rail:220px; --head:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{
  background:var(--accent); color:#fff; padding:0 0 20px;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:16px 18px 14px;border-bottom:1px solid rgba(255,255,255,.16)}
.brand b{display:block;font-size:14px;letter-spacing:.02em;font-weight:600}
.brand span{display:block;font-size:11px;color:rgba(255,255,255,.62);margin-top:2px;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.04em}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{
  all:unset;display:flex;align-items:center;gap:10px;cursor:pointer;
  padding:8px 11px;border-radius:5px;font-size:13px;color:rgba(255,255,255,.80);
  font-family:inherit;
}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.nav button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.nav .num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:rgba(255,255,255,.45);width:12px}
.nav button[aria-current="page"] .num{color:rgba(255,255,255,.8)}
.railfoot{margin-top:auto;padding:0 18px;font-size:11px;color:rgba(255,255,255,.5);
  font-family:"IBM Plex Mono",monospace;line-height:1.7}

.main{display:flex;flex-direction:column;min-width:0}
.head{
  height:var(--head);background:var(--surface);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:16px;padding:0 22px;position:sticky;top:0;z-index:5;
}
.head h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.head .crumb{color:var(--ink-3);font-weight:400}
.spacer{margin-left:auto}
.toggle{display:flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.toggle button{
  all:unset;cursor:pointer;padding:5px 13px;font-size:12px;font-weight:500;
  font-family:"IBM Plex Mono",monospace;color:var(--ink-2);
}
.toggle button[aria-pressed="true"]{background:var(--accent);color:#fff}
.toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.user{font-size:12px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
.content{padding:22px;flex:1}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px}
.card-h{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px}
.card-h h2{font-size:13px;font-weight:600;letter-spacing:.01em}
.card-h .sub{font-size:12px;color:var(--ink-3)}
.btn{
  all:unset;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;
  padding:6px 13px;border-radius:5px;border:1px solid var(--rule);color:var(--ink);background:var(--surface);
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.field{
  border:1px solid var(--rule);border-radius:5px;padding:5px 10px;font-size:12.5px;
  font-family:"IBM Plex Mono",monospace;background:var(--surface);color:var(--ink);width:180px;
}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}

table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);padding:8px 14px;border-bottom:1px solid var(--rule);background:var(--surface-2);
  white-space:nowrap;
}
td{padding:7px 14px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace}
.id{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--accent)}

.pill{
  display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  padding:2px 7px;border-radius:3px;font-family:"IBM Plex Mono",monospace;white-space:nowrap;
}
.p-ok{background:var(--ok-tint);color:var(--ok)}
.p-warn{background:var(--warn-tint);color:var(--warn)}
.p-bad{background:var(--bad-tint);color:var(--bad)}
.p-deg{background:var(--degraded-tint);color:var(--degraded)}
.p-mute{background:var(--rule-2);color:var(--ink-2)}

.banner{
  display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:6px;
  border:1px solid var(--warn);background:var(--warn-tint);color:#7A5210;font-size:12.5px;margin-bottom:16px;
}
.banner.conflict{border-color:var(--degraded);background:var(--degraded-tint);color:#4A3E7A;
  align-items:flex-start;flex-direction:column;gap:8px}
.banner .btn{background:transparent}

/* ---------- signature: tolerance band ---------- */
.band{display:block}
.band-legend{display:flex;gap:14px;font-size:10.5px;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace;margin-top:5px;flex-wrap:wrap}
.band-legend i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.swatch{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ---------- screen 2 : three panes ---------- */
.panes{display:grid;grid-template-columns:250px 240px 1fr;gap:14px;align-items:start}
.pane-list{list-style:none}
.pane-list li{border-bottom:1px solid var(--rule-2)}
.pane-list li:last-child{border-bottom:0}
.pane-list button{
  all:unset;cursor:pointer;display:flex;gap:9px;align-items:baseline;width:100%;
  padding:8px 14px;font-size:12.5px;font-family:inherit;box-sizing:border-box;
}
.pane-list button:hover{background:var(--surface-2)}
.pane-list button[aria-current="true"]{background:var(--accent-tint);
  box-shadow:inset 2px 0 0 var(--accent);font-weight:600}
.pane-list button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pane-list .ord{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);font-size:11px;width:14px}
.pane-list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pane-list .ct{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);font-size:11px}
.grip{color:var(--ink-3);cursor:grab;font-size:11px}

.rdef{padding:14px 16px;border-bottom:1px solid var(--rule-2)}
.rdef:last-child{border-bottom:0}
.rdef-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.rdef-top .nm{font-weight:600;font-size:13.5px}
.limits{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.limits label{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin-bottom:3px}
.limits input{width:100%;border:1px solid var(--rule);border-radius:4px;padding:4px 7px;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--surface);color:var(--ink)}
.limits input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.inline-err{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;
  color:var(--bad);background:var(--bad-tint);padding:6px 10px;border-radius:4px}

/* ---------- screen 3 : matrix ---------- */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix th.rot{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:0;
  text-transform:none;color:var(--ink-2)}
.matrix input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.matrix tbody tr:hover{background:var(--accent-tint)}
.stn{font-family:"IBM Plex Mono",monospace;font-weight:500}

/* ---------- screen 4 : ingest log ---------- */
.filters{display:flex;gap:6px;align-items:center}
.chip{
  all:unset;cursor:pointer;font-size:12px;padding:4px 11px;border-radius:20px;
  border:1px solid var(--rule);color:var(--ink-2);font-family:inherit;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rowbtn{all:unset;cursor:pointer;display:block;width:100%}
tr.expand td{background:#0F1620;padding:0;border-bottom:1px solid var(--rule)}
pre{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.65;color:#C7D3DE;
  padding:14px 18px;overflow-x:auto;white-space:pre;
}
pre .k{color:#8FB8E8}
pre .s{color:#9FD8A8}
pre .n{color:#E8C48F}
.caret{display:inline-block;width:10px;color:var(--ink-3);font-family:monospace}

.hidden{display:none !important}
.note{font-size:12px;color:var(--ink-3);margin-top:10px}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3);font-size:13px}

@media (max-width:1100px){
  .panes{grid-template-columns:1fr}
  :root{--rail:60px}
  .brand span,.nav button span.lbl,.railfoot{display:none}
  .nav button{justify-content:center}
}
@media (prefers-reduced-motion:no-preference){
  .content{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
}

.content{padding:26px 30px 32px;max-width:1680px;width:100%;margin:0 auto}

/* Global cards */
.card{border:1px solid var(--rule);border-radius:9px;box-shadow:0 1px 2px rgba(19,35,63,.025);overflow:hidden}
.card-h{min-height:54px;padding:14px 18px;border-bottom:1px solid var(--rule-2);gap:10px;background:#fff}
.card-h h2{font-size:13px;color:var(--ink);font-weight:650}
.card-h .sub{color:var(--ink-3)}

.btn{
  min-height:34px;padding:7px 13px;border-radius:7px;border-color:#CBD5E1;
  color:var(--ink);background:#fff;font-size:12.5px;transition:background .15s,border-color .15s,box-shadow .15s;
}
.btn:hover{background:#F5F8FC;border-color:#AEBBCB}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(0,87,217,.15)}
.btn.primary:hover{background:var(--accent-2)}
.field{height:36px;border-radius:7px;border-color:#CBD5E1;padding:7px 11px;background:#fff;font-family:inherit}
.field:focus{outline:2px solid rgba(0,87,217,.18);border-color:var(--accent)}

/* Tables: more breathing room */
table{table-layout:auto}
th{padding:10px 16px;background:#F8FAFC;color:#718096;font-size:10px;border-bottom:1px solid var(--rule);letter-spacing:.06em}
td{padding:10px 16px;border-bottom:1px solid var(--rule-2);height:44px}
tbody tr:hover{background:#F7FAFF}
.id{color:var(--accent)}
.pill{padding:3px 8px;border-radius:999px;font-family:inherit;font-size:10.5px;letter-spacing:.01em}
.p-ok{background:var(--ok-tint);color:#258C2B}
.p-warn{background:var(--warn-tint);color:#765A27}
.p-bad{background:var(--bad-tint);color:#B42318}
.p-deg{background:var(--degraded-tint);color:#405796}
.p-mute{background:#EEF2F6;color:#5F6F84}

/* Alert/advisory: teal instead of yellow */
.banner{padding:12px 15px;border-radius:8px;border:1px solid #C9D0D8;background:var(--warn-tint);color:#46515F;margin-bottom:18px}
.banner.conflict{border-color:#B6C2E6;background:var(--degraded-tint);color:#344A86}

/* Screen 1 — flows: create clear vertical hierarchy */
.content > .card:has(table){margin-top:2px}
.content > .card > .card-h{padding:16px 18px}
.content > .card > .card-h .field{margin-left:auto}

/* Screen 2 — editor becomes 2-column workbench:
   left = persistent process-step navigation;
   right = operations + value definitions stacked vertically. */
.panes{
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
  grid-template-rows:auto auto;
  gap:16px;
  align-items:start;
}
.panes > .card:nth-child(1){grid-column:1;grid-row:1 / span 2;position:sticky;top:80px}
.panes > .card:nth-child(2){grid-column:2;grid-row:1;min-width:0}
.panes > .card:nth-child(3){grid-column:2;grid-row:2;min-width:0}

.pane-list li{border-bottom:1px solid var(--rule-2)}
.pane-list button{min-height:48px;padding:9px 14px;gap:9px}
.pane-list button:hover{background:#F7FAFF}
.pane-list button[aria-current="true"]{background:var(--accent-tint);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.pane-list .ord{color:var(--ink-3)}
.grip{color:#9AA7B8}

/* Process steps: easier scanning */
.panes > .card:nth-child(1) .card-h{position:sticky;top:0;z-index:2}
.panes > .card:nth-child(1) .pane-list .nm{line-height:1.3}

/* Operations: use a compact data table feel */
.panes > .card:nth-child(2) .pane-list button{min-height:52px}
.panes > .card:nth-child(2) .pane-list .nm{display:flex;gap:10px;align-items:center}

/* Value definitions: more space per definition */
.rdef{padding:18px 20px;border-bottom:1px solid var(--rule-2)}
.rdef-top{gap:8px;margin-bottom:13px}
.rdef-top .nm{font-size:14px;color:var(--ink)}
.limits{grid-template-columns:repeat(5,minmax(80px,1fr));gap:10px;margin-top:14px}
.limits label{font-size:9.5px;color:#738197}
.limits input{height:34px;padding:6px 9px;border-radius:6px;font-family:inherit;border-color:#CBD5E1}
.inline-err{margin-top:12px;padding:8px 10px;border-radius:6px;color:#B42318;background:var(--bad-tint)}
.note{color:var(--ink-3)}

/* Tolerance band — quieter visual footprint */
.band-legend{gap:12px;color:var(--ink-3);font-family:inherit}

/* Screen 3 matrix */
.matrix th,.matrix td{padding:12px 14px}
.matrix tbody tr:hover{background:var(--accent-tint)}
.matrix input{width:16px;height:16px;accent-color:var(--accent)}

/* Screen 4 log */
.filters{gap:7px}
.chip{padding:6px 12px;border-radius:999px;border-color:#CBD5E1}
.chip[aria-pressed="true"]{background:var(--accent-tint);border-color:#A9C8FF;color:var(--accent)}
tr.expand td{background:#16263D}
pre{padding:18px 20px}

/* Better action grouping and spacing */
.content .card-h > .spacer{min-width:10px}
.content .card-h > .btn + .btn{margin-left:2px}

/* Keep the editor usable at laptop widths */
@media (max-width:1280px){
  .content{padding:22px 22px 28px}
  .panes{grid-template-columns:235px minmax(0,1fr);gap:14px}
  .limits{grid-template-columns:repeat(5,minmax(65px,1fr))}
}
@media (max-width:980px){
  :root{--rail:64px}
  .brand{padding:0 16px;justify-content:center}
  .brand span,.nav button span.lbl,.railfoot{display:none}
  .nav button{justify-content:center}
  .head{padding:0 18px}
  .content{padding:18px}
  .panes{grid-template-columns:1fr}
  .panes > .card:nth-child(1),.panes > .card:nth-child(2),.panes > .card:nth-child(3){grid-column:1;grid-row:auto;position:static}
}
</style>

<style id="valeo-final-adjustments">
/* ================================================================
   VALEO FINAL ADJUSTMENTS
   Advisory = neutral grey from supplied reference image.
   Navigation emphasis = Valeo Technical Blue.
   Editor actions are aligned with their section headers.
   ================================================================ */
:root{
  --advisory:#E8EBF0;
  --advisory-border:#C9D0D8;
  --advisory-ink:#46515F;
  --technical-blue:#0057D9;
  --technical-blue-tint:#EAF2FF;
  --warn:#8A6A2F;
  --warn-tint:#F3EFE6;
}

/* Advisory / non-blocking information: neutral grey, not cyan/teal. */
.banner{
  border-color:var(--advisory-border);
  background:var(--advisory);
  color:var(--advisory-ink);
}
.banner .btn{
  border-color:#B8C0CA;
  background:#F7F8FA;
  color:#263548;
}
.banner .btn:hover{
  background:#fff;
  border-color:#9DA7B3;
}
.banner.conflict{
  border-color:#B9C3CF;
  background:#EEF1F4;
  color:#3F4D5D;
}

/* Remove the remaining teal treatment from the warning/status pill.
   Warning remains distinguishable without using cyan/teal. */
.p-warn{
  background:#F2EEE7;
  color:#7A5A21;
}

/* Technical Blue is reserved for navigation focus/selection. */
.nav button[aria-current="page"]{
  background:var(--technical-blue-tint);
  color:var(--technical-blue);
  font-weight:700;
  box-shadow:inset 3px 0 0 var(--technical-blue);
}
.nav button[aria-current="page"] .num:before{
  color:var(--technical-blue);
}
.nav button:focus-visible{
  outline:2px solid var(--technical-blue);
  outline-offset:-2px;
}

/* Editor card headers: title/subtitle stay together; action sits on the
   same baseline at the far right, with no overlap. */
.editor-pane-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:nowrap !important;
}
.editor-pane-header .card-title-group{
  min-width:0;
  display:flex;
  align-items:baseline;
  gap:10px;
  flex:1 1 auto;
}
.editor-pane-header .card-title-group h2{
  flex:0 0 auto;
}
.editor-pane-header .card-title-group .sub{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.editor-pane-header > .btn{
  flex:0 0 auto;
  margin-left:auto;
}

/* Keep the Process Steps and Operations header actions visually identical. */
.panes > .card:nth-child(1) .editor-pane-header,
.panes > .card:nth-child(2) .editor-pane-header{
  min-height:56px;
  padding:11px 14px;
}
.panes > .card:nth-child(1) .editor-pane-header > .btn,
.panes > .card:nth-child(2) .editor-pane-header > .btn{
  min-height:32px;
  height:32px;
  padding:0 12px;
}

/* Do not let narrow desktop widths cause header/action collisions. */
@media (max-width:760px){
  .editor-pane-header{
    flex-wrap:wrap !important;
    row-gap:8px;
  }
  .editor-pane-header .card-title-group{
    flex:1 1 100%;
  }
  .editor-pane-header > .btn{
    margin-left:0;
  }
}
</style>

/* ---------------------------------------------------------------
   Signature element — the four-limit tolerance band
----------------------------------------------------------------*/
function band(d, value){
  if(d.lsl==null||d.usl==null)
    return `<div class="note">No limits defined — values recorded without comparison.</div>`;

  const lo = Math.min(d.lsl,d.usl), hi = Math.max(d.lsl,d.usl);
  const lal = Math.min(d.lal,d.ual), ual = Math.max(d.lal,d.ual);
  const pad = (hi-lo)*0.18, min = lo-pad, max = hi+pad, W = 100;
  const x = v => ((v-min)/(max-min))*W;

  const marker = value==null ? '' : `
    <line x1="${x(value)}" y1="1" x2="${x(value)}" y2="21" stroke="var(--ink)" stroke-width="1.4"/>
    <polygon points="${x(value)-3.2},0 ${x(value)+3.2},0 ${x(value)},4" fill="var(--ink)"/>`;

  return `
  <svg class="band" viewBox="0 0 100 32" width="100%" height="32" preserveAspectRatio="none"
       role="img" aria-label="Tolerance band from ${d.lsl} to ${d.usl}">
    <rect x="0" y="8" width="100" height="7" fill="var(--bad-tint)"/>
    <rect x="${x(lo)}" y="8" width="${x(hi)-x(lo)}" height="7" fill="var(--warn-tint)"/>
    <rect x="${x(lal)}" y="8" width="${x(ual)-x(lal)}" height="7" fill="var(--ok-tint)"/>
    <line x1="${x(lo)}"  y1="6" x2="${x(lo)}"  y2="17" stroke="var(--bad)"  stroke-width=".8"/>
    <line x1="${x(hi)}"  y1="6" x2="${x(hi)}"  y2="17" stroke="var(--bad)"  stroke-width=".8"/>
    <line x1="${x(lal)}" y1="6" x2="${x(lal)}" y2="17" stroke="var(--warn)" stroke-width=".8"/>
    <line x1="${x(ual)}" y1="6" x2="${x(ual)}" y2="17" stroke="var(--warn)" stroke-width=".8"/>
    ${d.nom!=null?`<line x1="${x(d.nom)}" y1="7" x2="${x(d.nom)}" y2="16"
        stroke="var(--ok)" stroke-width=".8" stroke-dasharray="1.5 1.5"/>`:''}
    ${marker}
  </svg>
  <div class="band-legend">
    <i><span class="swatch" style="background:var(--bad-tint);border:1px solid var(--bad)"></span>out of spec</i>
    <i><span class="swatch" style="background:var(--warn-tint);border:1px solid var(--warn)"></span>alert band</i>
    <i><span class="swatch" style="background:var(--ok-tint);border:1px solid var(--ok)"></span>nominal band</i>
    ${value!=null?`<i>measured <b>${value}</b> ${d.uom}</i>`:''}
  </div>`;
}

/* ---------------------------------------------------------------
   State
----------------------------------------------------------------*/
let role   = 'site';
let screen = 'flows';
let sel    = {step:11001, op:123021, filter:'all', open:null};

const SCREENS = {
  flows:  {n:'01', label:'Process flows', title:'Process flows',        roles:['site']},
  editor: {n:'02', label:'Flow editor',   title:'MATERIAL-1 / FLOW1',   roles:['site','edge']},
  matrix: {n:'03', label:'Station matrix',title:'Station assignment',   roles:['site']},
  log:    {n:'04', label:'Ingest log',    title:'Ingest log',           roles:['edge']},
};

function setRole(r){
  role = r;
  document.getElementById('tgSite').setAttribute('aria-pressed', r==='site');
  document.getElementById('tgEdge').setAttribute('aria-pressed', r==='edge');
  document.getElementById('railRole').textContent = r;
  if(!SCREENS[screen].roles.includes(r))
    screen = r==='site' ? 'flows' : 'editor';
  render();
}
function go(s){ screen = s; render(); }

/* ---------------------------------------------------------------
   Screens
----------------------------------------------------------------*/
function viewFlows(){
  return `
  <div class="banner">
    <strong>1 value definition needs naming.</strong>
    A station sent result ID 50130, which was not in the model. It was recorded and a
    placeholder created — give it a name and limits.
    <span class="spacer"></span>
    <button class="btn" onclick="sel.step=11001;sel.op=123024;go('editor')">Review</button>
  </div>

  <div class="card">
    <div class="card-h">
      <h2>Process flows</h2>
      <span class="sub">3 parts configured</span>
      <span class="spacer"></span>
      <input class="field" placeholder="Search part number" aria-label="Search part number">
      <button class="btn">Import CSV</button>
      <button class="btn primary">New flow</button>
    </div>
    <table>
      <thead><tr>
        <th>Part number</th><th>Flow</th><th class="num">Steps</th>
        <th class="num">Version</th><th>Status</th><th></th>
      </tr></thead>
      <tbody>
      ${FLOWS.map(f=>`
        <tr>
          <td class="id">${f.part}</td>
          <td class="mono">${f.flow}</td>
          <td class="num">${f.steps}</td>
          <td class="num">v${f.v}</td>
          <td><span class="pill ${f.status==='published'?'p-ok':'p-mute'}">${f.status}</span></td>
          <td style="text-align:right"><button class="btn" onclick="go('editor')">Open</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function viewEditor(){
  const ops   = OPS[sel.step] || [];
  const rdefs = RDEFS[sel.op] || [];

  const conflict = role==='edge' ? `
    <div class="banner conflict">
      <strong>This change was rejected by Site.</strong>
      <div style="font-size:12.5px">
        You set <code>50032</code> USL to <b>102</b> from version v12.
        Site has since moved to v13, where USL is <b>105</b> (m.molina).
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn">Keep mine (102)</button>
        <button class="btn primary">Take Site's (105)</button>
      </div>
    </div>` : '';

  return `
  ${conflict}
  <div class="panes">

    <div class="card">
      <div class="card-h editor-pane-header">
        <div class="card-title-group">
          <h2>Process steps</h2>
          <span class="sub">drag to reorder</span>
        </div>
        <button class="btn" type="button">Add step</button>
      </div>
      <ul class="pane-list">
        ${STEPS.map((s,i)=>`
          <li><button aria-current="${s.id===sel.step}" onclick="sel.step=${s.id};sel.op=${(OPS[s.id]||[{id:0}])[0].id};render()">
            <span class="grip" aria-hidden="true">⠿</span>
            <span class="ord">${i+1}</span>
            <span class="nm"><span class="id">${s.id}</span> ${s.name}</span>
            <span class="ct">${s.ops}</span>
          </button></li>`).join('')}
      </ul>
    </div>

    <div class="card">
      <div class="card-h editor-pane-header">
        <div class="card-title-group">
          <h2>Operations</h2>
        </div>
        <button class="btn" type="button">Add operation</button>
      </div>
      ${ops.length?`
      <ul class="pane-list">
        ${ops.map(o=>`
          <li><button aria-current="${o.id===sel.op}" onclick="sel.op=${o.id};render()">
            <span class="nm"><span class="id">${o.id}</span> ${o.name}</span>
            <span class="ct">${o.n}</span>
          </button></li>`).join('')}
      </ul>`
      :`<div class="empty">No operations defined for this step yet.<br>
          <button class="btn primary" style="margin-top:12px">Add the first operation</button></div>`}
    </div>

    <div class="card">
      <div class="card-h">
        <h2>Value definitions</h2>
        <span class="sub">${rdefs.length} defined</span>
        <span class="spacer"></span>
        <button class="btn">Validate</button>
        <button class="btn primary">Publish v13</button>
      </div>
      ${rdefs.length? rdefs.map(d=>`
        <div class="rdef">
          <div class="rdef-top">
            <span class="id">${d.id}</span>
            <span class="nm">${d.name}</span>
            <span class="pill p-mute">${d.type}</span>
            <span class="pill p-mute">${d.cat}</span>
            ${d.uom?`<span class="pill p-mute">${d.uom}</span>`:''}
            ${d.mand?`<span class="pill p-ok">mandatory</span>`:''}
            ${d.auto?`<span class="pill p-deg">created automatically</span>`:''}
            <span class="spacer"></span>
            ${d.nom!=null?`<span class="mono" style="color:var(--ink-2);font-size:12px">nominal ${d.nom}</span>`:''}
          </div>

          ${band(d, null)}

          <div class="limits">
            <div><label>LSL</label><input value="${d.lsl??''}" placeholder="—"></div>
            <div><label>LAL</label><input value="${d.lal??''}" placeholder="—"></div>
            <div><label>Nominal</label><input value="${d.nom??''}" placeholder="—"></div>
            <div><label>UAL</label><input value="${d.ual??''}" placeholder="—"></div>
            <div><label>USL</label><input value="${d.usl??''}" placeholder="—"></div>
          </div>

          ${d.err?`<div class="inline-err"><strong>Blocks publish.</strong> ${d.err}</div>`:''}
          ${d.auto?`<div class="note">Recorded 47 times since 02:14 today. Naming it will not change
             the values already stored.</div>`:''}
        </div>`).join('')
      :`<div class="empty">This operation records nothing yet.</div>`}
      <div style="padding:12px 16px;border-top:1px solid var(--rule-2)">
        <button class="btn">Add value definition</button>
      </div>
    </div>
  </div>`;
}

function viewMatrix(){
  return `
  <div class="card">
    <div class="card-h">
      <h2>Station assignment</h2>
      <span class="sub">LINE-1 · work centre APU1_NOC5</span>
      <span class="spacer"></span>
      <span class="note" style="margin:0">Two stations may run the same step.</span>
    </div>
    <table class="matrix">
      <thead><tr>
        <th>Station</th>
        ${STEPS.map(s=>`<th class="rot">${s.id}</th>`).join('')}
      </tr></thead>
      <tbody>
      ${STATIONS.map(st=>`
        <tr>
          <td class="stn">${st}</td>
          ${STEPS.map(s=>`<td>
            <input type="checkbox" ${MATRIX[st].includes(s.id)?'checked':''}
                   aria-label="${st} runs step ${s.id}">
          </td>`).join('')}
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
  <div class="note">Columns are process step IDs. ST060.1 and ST060.2 both run 11001 Housing Screwing.</div>`;
}

function statusPill(s){
  const m = {
    RECORDED:'p-ok', RECORDED_DEGRADED:'p-deg', RECORDED_PARTIAL:'p-warn',
    DUPLICATE_IGNORED:'p-mute', REJECTED_UNPARSEABLE:'p-bad', SYSTEM_UNAVAILABLE:'p-bad'
  };
  return `<span class="pill ${m[s]||'p-mute'}">${s}</span>`;
}

function viewLog(){
  const rows = LOG.filter(r=>
    sel.filter==='all' ? true :
    sel.filter==='degraded' ? r.status.includes('DEGRADED')||r.status.includes('PARTIAL') :
    r.status.startsWith('REJECTED')||r.status.startsWith('SYSTEM'));

  return `
  <div class="card">
    <div class="card-h">
      <h2>Ingest log</h2>
      <span class="sub">every attempt, with the message exactly as received</span>
      <span class="spacer"></span>
      <div class="filters">
        <button class="chip" aria-pressed="${sel.filter==='all'}"      onclick="sel.filter='all';render()">All</button>
        <button class="chip" aria-pressed="${sel.filter==='degraded'}" onclick="sel.filter='degraded';render()">Degraded</button>
        <button class="chip" aria-pressed="${sel.filter==='failed'}"   onclick="sel.filter='failed';render()">Failed</button>
      </div>
    </div>
    <table>
      <thead><tr>
        <th style="width:26px"></th><th>Time</th><th>Source</th><th>Status</th>
        <th class="num">Latency</th><th>Reasons</th>
      </tr></thead>
      <tbody>
      ${rows.length? rows.map((r,i)=>`
        <tr>
          <td><button class="rowbtn" onclick="sel.open = sel.open===${i}?null:${i};render()"
                aria-expanded="${sel.open===i}" aria-label="Show raw message">
              <span class="caret">${sel.open===i?'▾':'▸'}</span></button></td>
          <td class="mono">${r.t}</td>
          <td class="mono">${r.src}</td>
          <td>${statusPill(r.status)}</td>
          <td class="num">${r.lat.toFixed(1)} ms</td>
          <td>${r.reasons.map(x=>`<span class="pill p-deg">${x}</span>`).join(' ')||
              '<span style="color:var(--ink-3)">—</span>'}</td>
        </tr>
        ${sel.open===i?`<tr class="expand"><td colspan="6"><pre>${
          RAW.replace(/"([^"]+)":/g,'<span class="k">"$1"</span>:')
             .replace(/: "([^"]*)"/g,': <span class="s">"$1"</span>')
             .replace(/: (-?\\d+\\.?\\d*)/g,': <span class="n">$1</span>')
        }</pre></td></tr>`:''}
      `).join('')
      :`<tr><td colspan="6"><div class="empty">Nothing matches this filter in the last 15 minutes.</div></td></tr>`}
      </tbody>
    </table>
  </div>
  <div class="note">Rejected messages are kept here too, with the raw body, so nothing is ever lost.</div>`;
}

/* ---------------------------------------------------------------
   Render
----------------------------------------------------------------*/
function render(){
  const nav = document.getElementById('nav');
  nav.innerHTML = Object.entries(SCREENS)
    .filter(([,s])=>s.roles.includes(role))
    .map(([k,s])=>`
      <button ${screen===k?'aria-current="page"':''} onclick="go('${k}')">
        <span class="num">${s.n}</span><span class="lbl">${s.label}</span>
      </button>`).join('');

  document.getElementById('title').textContent = SCREENS[screen].title;
  document.getElementById('crumb').textContent =
    role==='edge' ? '· edge, local copy' : '· site, master';

  const body = {flows:viewFlows, editor:viewEditor, matrix:viewMatrix, log:viewLog}[screen];
  document.getElementById('content').innerHTML = body();
}
render();
</script>
</body>
</html>
